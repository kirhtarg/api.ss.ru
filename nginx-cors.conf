# CORS configuration for Nginx
# Add this to your server block in nginx.conf

# Special handling for API routes with export parameters
location ~ ^/api/.*[?&](for_export=1|per_page=5000) {
    # Allow specific origins for export requests
    if ($http_origin ~* "^https?://(skateandsnow\.ru|admin\.skateandsnow\.ru|api\.skateandsnow\.ru)$") {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN, X-XSRF-TOKEN, X-Session-ID' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # Handle CORS preflight requests
    if ($request_method = 'OPTIONS') {
        return 200;
    }

    # Your existing configuration...
    try_files $uri $uri/ /index.php?$query_string;
}

# General CORS for other API routes
location /api/ {
    # Handle CORS preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN, X-XSRF-TOKEN, X-Session-ID' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        return 200;
    }

    # Add CORS headers for all requests
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN, X-XSRF-TOKEN, X-Session-ID' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Your existing configuration...
    try_files $uri $uri/ /index.php?$query_string;
}