[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/api.ss.ru/artisan queue:work --queue=default,images --tries=3 --timeout=7200 --sleep=3 --backoff=5 --max-time=10800 --memory=2048
directory=/var/www/api.ss.ru
autostart=true
autorestart=true
user=www-data
environment=HOME="/var/www"
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/api.ss.ru/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopasgroup=true
killasgroup=true
stopwaitsecs=7300
