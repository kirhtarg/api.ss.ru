<!DOCTYPE html>
<html>
<head>
    <title>CORS Test Production</title>
</head>
<body>
    <h1>CORS Test - Production Server</h1>
    <button onclick="testCors()">Test CORS from Production</button>
    <div id="result"></div>

    <script>
        async function testCors() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing CORS from production server...';

            try {
                const response = await fetch('https://api.skateandsnow.ru/api/admin/shop/goods?per_page=1&with_variations=0&for_export=0', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                result.innerHTML = '<pre style="color: green;">SUCCESS: ' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                result.innerHTML = '<pre style="color: red;">ERROR: ' + error.message + '</pre>';
                console.error('CORS Error Details:', error);
            }
        }
    </script>
</body>
</html>
