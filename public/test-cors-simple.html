<!DOCTYPE html>
<html>
<head>
    <title>Simple CORS Test</title>
</head>
<body>
    <h1>Simple CORS Test - No Auth</h1>
    <button onclick="testCors()">Test Simple CORS</button>
    <div id="result"></div>

    <script>
        async function testCors() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing simple CORS...';

            try {
                const response = await fetch('https://api.skateandsnow.ru/api/public/shop/goods?per_page=1', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();
                result.innerHTML = '<pre style="color: green;">SUCCESS: ' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                result.innerHTML = '<pre style="color: red;">ERROR: ' + error.message + '</pre>';
                console.error('CORS Error Details:', error);
            }
        }
    </script>
</body>
</html>
