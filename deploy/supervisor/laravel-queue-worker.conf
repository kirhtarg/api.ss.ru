; Минимальная конфигурация Supervisor для очередей Laravel (Redis)
; Копируйте этот файл в /etc/supervisor/conf.d/ и выполните:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start ss-queue-worker:*
;
; ВАЖНО: замените абсолютный путь к php и к artisan (command=...)
; Например: /usr/bin/php /var/www/api.ss.ru/artisan queue:work redis ...

[program:ss-queue-worker]
process_name=%(program_name)s_%(process_num)02d
; Следующая команда слушает очереди default и images
command=/usr/bin/php /var/www/api.ss.ru/artisan queue:work redis --queue=default,images --sleep=3 --tries=3 --backoff=5 --max-time=3600
autostart=true
autorestart=true
; Количество параллельных воркеров подбирайте по CPU/IO (начните с 3)
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ss-queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=3600
startretries=3
stopasgroup=true
killasgroup=true

