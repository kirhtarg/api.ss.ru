; Минимальная конфигурация Supervisor для очередей Laravel (Redis)
; Копируйте этот файл в /etc/supervisor/conf.d/ и выполните:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start ss-queue-worker:*
;
; ВАЖНО: замените абсолютный путь к php и к artisan (command=...)
; Драйвер очереди берётся из QUEUE_CONNECTION в .env.

[program:ss-queue-worker]
process_name=%(program_name)s_%(process_num)02d
; Следующая команда слушает очереди default и images
command=/usr/bin/php /var/www/api.ss.ru/artisan queue:work --queue=default,images --sleep=3 --tries=3 --backoff=5 --timeout=7200 --max-time=10800 --memory=2048
directory=/var/www/api.ss.ru
autostart=true
autorestart=true
user=www-data
environment=HOME="/var/www"
; Количество параллельных воркеров подбирайте по CPU/IO (начните с 3)
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ss-queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=7300
startretries=3
stopasgroup=true
killasgroup=true
