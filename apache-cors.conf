# CORS configuration for Apache
# Add this to your .htaccess file or virtual host configuration

<IfModule mod_headers.c>
    # Handle CORS preflight requests
    <If "%{REQUEST_METHOD} == 'OPTIONS'">
        Header always set Access-Control-Allow-Origin %{HTTP:Origin}
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN, X-XSRF-TOKEN, X-Session-ID"
        Header always set Access-Control-Allow-Credentials "true"
        Header always set Access-Control-Max-Age "86400"
    </If>

    # Add CORS headers for all requests
    Header always set Access-Control-Allow-Origin %{HTTP:Origin}
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, X-CSRF-TOKEN, X-XSRF-TOKEN, X-Session-ID"
    Header always set Access-Control-Allow-Credentials "true"
</IfModule>

# For older Apache versions, use this instead:
# SetEnvIf Origin "^(https?://.*)$" ORIGIN=$1
# Header always set Access-Control-Allow-Origin %{ORIGIN}e env=ORIGIN